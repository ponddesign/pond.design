name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npm ls --omit=optional > /dev/null
        name: Check dependency tree is consistent
      - name: Check generated design tokens are up to date
        run: |
          yarn tokens
          git diff --exit-code -- app/styles/theme.css app/design-tokens.ts
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
