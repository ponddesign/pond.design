name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: package.json
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npm ls --omit=optional > /dev/null
        name: Check dependency tree is consistent
      - name: Check generated design tokens are up to date
        run: |
          yarn tokens
          git diff --exit-code -- app/styles/theme.css app/design-tokens.ts
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
