name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Lets the Figma token sync start CI on its PR branch: PRs opened with
  # GITHUB_TOKEN don't trigger `pull_request`, but workflow_dispatch works.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Check dependency tree is consistent
        run: |
          npm ls --omit=optional > /dev/null
          node scripts/check-lockstep.mjs
      - name: Check generated design tokens are up to date
        run: |
          yarn tokens
          git diff --exit-code -- app/styles/theme.css app/design-tokens.ts
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
