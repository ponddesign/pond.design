name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - name: Check dependency tree is consistent
        run: |
          npm ls --omit=optional > /dev/null
          node scripts/check-lockstep.mjs
      - name: Check generated design tokens are up to date
        run: |
          yarn tokens
          git diff --exit-code -- app/styles/theme.css app/design-tokens.ts
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build
