name: Sync design tokens from Figma

# Started by the "Pond Tokens → GitHub" Figma plugin (figma-plugin/). It sends
# the file's variables as a base64 JSON payload; this workflow imports them
# into ./tokens, rebuilds the generated files, verifies the site still builds,
# and opens (or updates) a pull request on the `figma/tokens` branch.

on:
  workflow_dispatch:
    inputs:
      payload:
        description: Base64-encoded JSON export from the Figma plugin
        required: true
        type: string
      note:
        description: Optional note from the designer
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  actions: write # start CI on the sync PR (see the last step)

concurrency:
  group: figma-tokens
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile

      - name: Import tokens from Figma
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: |
          printf '%s' "$PAYLOAD" | base64 --decode > "$RUNNER_TEMP/figma-export.json"
          node scripts/import-figma-tokens.mjs "$RUNNER_TEMP/figma-export.json" "$RUNNER_TEMP/summary.md"
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"

      - run: yarn tokens

      # PRs opened with GITHUB_TOKEN don't trigger the CI workflow, so verify here.
      - run: yarn lint
      - run: yarn typecheck
      - run: yarn build

      - name: Write PR body
        env:
          NOTE: ${{ inputs.note }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "Design tokens exported from Figma by the **Pond Tokens → GitHub** plugin."
            if [ -n "$NOTE" ]; then printf '\n> %s\n' "$NOTE"; fi
            echo
            cat "$RUNNER_TEMP/summary.md"
            echo
            echo "Lint, typecheck and build passed in [the sync run]($RUN_URL)."
          } > "$RUNNER_TEMP/pr-body.md"

      - id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: figma/tokens
          delete-branch: true
          commit-message: 'Sync design tokens from Figma'
          title: 'Sync design tokens from Figma'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: design-tokens
          add-paths: |
            tokens/**
            app/styles/theme.css
            app/design-tokens.ts

      # `verify` is a required check on main, but PRs opened with GITHUB_TOKEN
      # don't trigger the CI workflow. workflow_dispatch is the exception, so
      # start CI on the PR branch; its `verify` check attaches to the PR's head
      # commit.
      - name: Run CI on the sync PR
        if: >-
          steps.cpr.outputs.pull-request-operation == 'created' ||
          steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run ci.yml --repo "$GITHUB_REPOSITORY" --ref figma/tokens
