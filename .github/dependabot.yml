version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Hold majors we can't take yet: @vercel/react-router (1.3.7) only supports
    # React Router 7, and React Router 7 only supports TypeScript <= 6. The
    # adapter itself is NOT ignored; when Dependabot proposes a version that
    # supports React Router 8, remove these rules and upgrade (see #111).
    ignore:
      - dependency-name: 'react-router'
        versions: ['>=8']
      - dependency-name: '@react-router/*'
        versions: ['>=8']
      - dependency-name: 'typescript'
        versions: ['>=7']
    groups:
      # These packages are released in lockstep and must stay on the same
      # version — never let them be bumped independently.
      react-router:
        patterns:
          - react-router
          - '@react-router/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      dev-tooling-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
