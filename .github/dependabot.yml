version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Hold React Router 8 and TypeScript 7 (React Router 7 supports TypeScript
    # <= 6) until they're upgraded together in one PR, after the move to
    # Cloudflare (#121). Then remove these rules.
    ignore:
      - dependency-name: 'react-router'
        versions: ['>=8']
      - dependency-name: '@react-router/*'
        versions: ['>=8']
      - dependency-name: 'typescript'
        versions: ['>=7']
      # Keep Node's types on the runtime's major (.nvmrc / engines.node), so
      # TypeScript can't accept APIs production doesn't have. Bump all three
      # together when moving to a new Node LTS.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      # These packages are released in lockstep and must stay on the same
      # version — never let them be bumped independently.
      react-router:
        patterns:
          - react-router
          - '@react-router/*'
      react:
        patterns:
          - react
          - react-dom
          - '@types/react'
          - '@types/react-dom'
      dev-tooling-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
